name: Deploy Slipway to Azure
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "labs/lab-12-build-containerise-deploy/solution/**"
      - ".github/workflows/azure-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    defaults:
      run:
        working-directory: slipway
    steps:
      - uses: actions/checkout@v5

      - uses: Azure/setup-azd@v2

      # Authenticates az (used by scripts/azd-postprovision.sh) via the same
      # federated OIDC credential — no client secret is ever stored.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Authenticates azd itself via the same federated credential.
      - name: Log in with azd
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy application
        run: azd deploy --no-prompt

      - name: Smoke test /api/health
        run: |
          url=$(azd env get-value WEB_URI)
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors "$url/api/health"
