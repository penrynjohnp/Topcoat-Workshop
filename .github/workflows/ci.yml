name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every lab has a real book page
        run: |
          for d in labs/lab-*/; do
            n=$(basename "$d" | cut -d- -f2)
            p="docs/src/02-labs/lab-$n.md"
            grep -q '{{#include' "$p" 2>/dev/null || { echo "::error::$p missing or still a stub"; exit 1; }
          done
      - name: AGENTS.md and copilot-instructions.md must match
        run: diff -q AGENTS.md .github/copilot-instructions.md
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Install topcoat-cli
        run: cargo install topcoat-cli --version 0.7.0 --locked
      - run: cargo fmt --all --check
      - name: topcoat fmt (no --check flag; fail if it changes anything)
        run: |
          topcoat fmt $(git ls-files 'labs/**/*.rs' 'slipway/**/*.rs')
          git diff --exit-code -- '*.rs'
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
