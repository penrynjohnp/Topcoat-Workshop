[workspace]
resolver = "2"
members = [
    "labs/lab-01-hello-topcoat/starter",
    "labs/lab-01-hello-topcoat/solution",
    "labs/lab-02-view-macro/starter",
    "labs/lab-02-view-macro/solution",
    "labs/lab-03-components/starter",
    "labs/lab-03-components/solution",
    "labs/lab-04-routing/starter",
    "labs/lab-04-routing/solution",
    "labs/lab-05-cx-memoize/starter",
    "labs/lab-05-cx-memoize/solution",
    "labs/lab-06-auth-sessions-mail/starter",
    "labs/lab-06-auth-sessions-mail/solution",
    "labs/lab-07-signals-expressions/starter",
    "labs/lab-07-signals-expressions/solution",
    "labs/lab-08-shards-procedures-streaming/starter",
    "labs/lab-08-shards-procedures-streaming/solution",
    "labs/lab-09-htmx-alpine/starter",
    "labs/lab-09-htmx-alpine/solution",
    "labs/lab-10-toasty-sqlite/starter",
    "labs/lab-10-toasty-sqlite/solution",
    "labs/lab-11-assets-tailwind-ui/starter",
    "labs/lab-11-assets-tailwind-ui/solution",
    "labs/lab-12-build-containerise-deploy/starter",
    "labs/lab-12-build-containerise-deploy/solution",
    "labs/lab-13-tower-bridge/starter",
    "labs/lab-13-tower-bridge/solution",
]

# Single source of truth for versions — see COMPATIBILITY.md
[workspace.dependencies]
topcoat = { version = "=0.7.0", features = ["mail"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
web-time = "1"
toasty = { version = "=0.10.0", features = ["postgresql", "sqlite"] }
topcoat-asset = { version = "=0.7.0", features = ["bundler"] }
azure_core = { version = "=0.30.1", default-features = false, features = ["reqwest", "reqwest_gzip", "tokio"] }
azure_identity = { version = "=0.30.0", default-features = false, features = ["tokio"] }
base64 = "0.22"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["full"] }

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
